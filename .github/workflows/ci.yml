# Push or PR -> pytest. The contest-time EC2 deploy job was removed with the contest
# infrastructure; scripts/ and docs/deploy.md keep how it worked.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q   # -m puts the repo on sys.path so tests import app
